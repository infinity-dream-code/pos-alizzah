<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6b4a" />
    <meta name="description" content="Facepay Alizzah — pembayaran wajah & panel pengelola" />
    <title>Facepay Alizzah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="kantin/css/kantin.css" />
  </head>
  <body class="portal-page">
    <div class="portal-bg" aria-hidden="true">
      <span class="portal-bg__orb portal-bg__orb--a"></span>
      <span class="portal-bg__orb portal-bg__orb--b"></span>
      <span class="portal-bg__grid"></span>
    </div>

    <main class="portal">
      <header class="portal__brand">
        <div class="portal__mark" aria-hidden="true">FA</div>
        <h1 class="portal__title">Facepay Alizzah</h1>
        <p class="portal__tagline">Pembayaran wajah &amp; panel pengelola.</p>
      </header>

      <nav class="portal__cta" aria-label="Pilih jalur masuk">
        <a class="portal-card portal-card--kantin" href="kantin/login.html">
          <span class="portal-card__eyebrow">Kantin</span>
          <span class="portal-card__label">Masuk Kantin</span>
          <span class="portal-card__desc">FacePay &amp; log pembelian</span>
          <span class="portal-card__go" aria-hidden="true">→</span>
        </a>
        <a class="portal-card portal-card--admin" href="admin/login.html">
          <span class="portal-card__eyebrow">Admin</span>
          <span class="portal-card__label">Masuk Admin</span>
          <span class="portal-card__desc">Data siswa, saldo &amp; uji wajah</span>
          <span class="portal-card__go" aria-hidden="true">→</span>
        </a>
        <a
          class="portal-card portal-card--pos"
          href="https://pos-demo.smartpayment.co.id"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="portal-card__eyebrow">POS</span>
          <span class="portal-card__label">Masuk POS</span>
          <span class="portal-card__desc">Kasir &amp; transaksi Smart Payment</span>
          <span class="portal-card__go" aria-hidden="true">→</span>
        </a>
      </nav>

      <p class="portal__ortu">
        Orang tua?
        <a href="ortu/">Buka portal ortu</a>
      </p>
    </main>
  </body>
</html>
